# Deskribe CI and manual deploy.
#
# ci:     builds and tests the repository, packs the CLI, installs it from the local package,
#         then validates and plans the example manifest against every example environment.
# deploy: manual only. Runs `deskribe apply` and `deskribe status` against the cluster in the
#         KUBECONFIG secret of the selected GitHub environment.
#
# To adapt this as a template for your own app repository:
#   - Replace the example manifest/platform paths (CI step and the deploy defaults below).
#   - Create GitHub environments (Settings > Environments) named after your Deskribe
#     environments, add a KUBECONFIG secret to each, and enable required reviewers on the
#     ones that need approval.
#   - Optionally set repository variables DESKRIBE_MANIFEST and DESKRIBE_PLATFORM.

name: Deskribe

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deskribe environment to deploy; must also be the name of a GitHub environment (e.g. dev)"
        required: true
        type: string
      image:
        description: "Image mapping: name=registry/image:tag (name is the service or workload name)"
        required: true
        type: string
      manifest:
        description: "Path to deskribe.json (default: variable DESKRIBE_MANIFEST, else the example)"
        required: false
        type: string
      platform:
        description: "Path to the platform config (default: variable DESKRIBE_PLATFORM, else the example)"
        required: false
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  ci:
    # The deploy job only runs on manual dispatch.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Deskribe.slnx

      - name: Build
        run: dotnet build Deskribe.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Deskribe.slnx --configuration Release --no-build

      - name: Pack CLI
        run: dotnet pack src/Deskribe.Cli --configuration Release --no-build --output ./nupkg

      - name: Install CLI from the local package
        run: dotnet tool install --global deskribe-cli --add-source ./nupkg --version 0.1.0

      - name: Validate and plan the example manifest in every example environment
        run: |
          set -euo pipefail
          for env in dev prod prod-eu prod-us; do
            echo "::group::$env"
            deskribe validate -f examples/payments-api/deskribe.json -p examples/platform-config --env "$env"
            deskribe plan -f examples/payments-api/deskribe.json -p examples/platform-config --env "$env"
            echo "::endgroup::"
          done

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Binding to the GitHub environment provides its secrets and required-reviewer approvals.
    environment: ${{ inputs.environment }}
    concurrency:
      group: deskribe-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and install the CLI
        run: |
          set -euo pipefail
          dotnet pack src/Deskribe.Cli --configuration Release --output ./nupkg
          dotnet tool install --global deskribe-cli --add-source ./nupkg --version 0.1.0

      - name: Write kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBECONFIG_CONTENT" ]; then
            echo "::error::Secret KUBECONFIG is not set for this environment"
            exit 1
          fi
          umask 077
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Apply
        env:
          DESKRIBE_ENV: ${{ inputs.environment }}
          DESKRIBE_IMAGE: ${{ inputs.image }}
          DESKRIBE_MANIFEST_PATH: ${{ inputs.manifest || vars.DESKRIBE_MANIFEST || 'examples/payments-api/deskribe.json' }}
          DESKRIBE_PLATFORM_PATH: ${{ inputs.platform || vars.DESKRIBE_PLATFORM || 'examples/platform-config' }}
        run: |
          deskribe apply -f "$DESKRIBE_MANIFEST_PATH" -p "$DESKRIBE_PLATFORM_PATH" --env "$DESKRIBE_ENV" --image "$DESKRIBE_IMAGE"

      - name: Status
        env:
          DESKRIBE_ENV: ${{ inputs.environment }}
          DESKRIBE_MANIFEST_PATH: ${{ inputs.manifest || vars.DESKRIBE_MANIFEST || 'examples/payments-api/deskribe.json' }}
          DESKRIBE_PLATFORM_PATH: ${{ inputs.platform || vars.DESKRIBE_PLATFORM || 'examples/platform-config' }}
        run: |
          deskribe status -f "$DESKRIBE_MANIFEST_PATH" -p "$DESKRIBE_PLATFORM_PATH" --env "$DESKRIBE_ENV"

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
